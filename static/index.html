<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>애니멀공화국 | 입양센터</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#322a25;background:#faf7f2}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;background:#925d41;color:white;border:0;border-radius:12px;padding:12px 17px;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eee5db;color:#624a3d}.wrap{max-width:980px;margin:auto;padding:18px 16px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:25px;margin:5px 0}h2{font-size:21px}p{line-height:1.6;color:#6d635b}.muted{font-size:13px;color:#82766e}.notice{background:#fff0df;padding:13px;border-radius:12px;font-size:13px;line-height:1.6;margin:15px 0}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tabs button{white-space:nowrap;background:#f0e8df;color:#604c40}.tabs button.active{background:#925d41;color:white}.card{background:#fff;border:1px solid #eae0d6;border-radius:18px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.catart{height:140px;background:linear-gradient(135deg,#f4e3d2,#e5c4a4);display:grid;place-items:center;font-size:64px;border-radius:13px}.pill{display:inline-block;border-radius:99px;background:#f0e4d6;padding:5px 9px;font-size:12px;color:#76513b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.choice{display:flex;gap:9px;align-items:center;padding:11px;border:1px solid #e8dfd6;border-radius:11px;margin:7px 0}input[type=text],input[type=tel],input[type=date],input[type=time],textarea,select{width:100%;border:1px solid #dcd2c8;border-radius:10px;padding:12px;background:white}textarea{min-height:105px}input[type=radio],input[type=checkbox]{accent-color:#925d41}.hidden{display:none}.progress{height:7px;border-radius:9px;background:#e8ded3;overflow:hidden}.bar{height:100%;background:#a56e50}.error{color:#b22525;font-size:13px}.summary{white-space:pre-wrap;background:#faf7f2;padding:14px;border-radius:12px;line-height:1.7;max-height:320px;overflow:auto}.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:6px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #eee;padding:10px;text-align:left}footer{margin-top:30px;color:#81756e;font-size:12px}@media(max-width:550px){h1{font-size:21px}.card{padding:16px}.wrap{padding:13px 12px 60px}}
.catphoto{width:100%;height:235px;object-fit:cover;border-radius:13px}.miniCat{border:1px solid #eee1d5;border-radius:13px;padding:10px;display:flex;align-items:center;gap:12px}.miniCat img{width:90px;height:90px;object-fit:cover;border-radius:10px}.miniCat p{margin:6px 0}.miniCat button{padding:8px;font-size:12px}.danger{background:#a7443e}.editor{border-top:2px solid #eee1d5;margin-top:22px;padding-top:15px}.editor input[type=file]{width:100%;max-width:100%} </style></head><body><main class="wrap"><header><div><span class="pill">Animal Republic · Adoption</span><h1>애니멀공화국 입양센터 🐈</h1></div><span class="muted">온라인 운영 버전 · 서버 연동</span></header><div class="notice">입양 상담 신청은 입양 확정을 의미하지 않습니다. 상담 신청은 관리자의 확인 후 확정됩니다. 관리자 정보는 서버에 저장되며 비밀번호는 서버에서 검증합니다. 공개 배포 전 개인정보 처리방침과 수집 동의를 확정해야 합니다.</div><nav class="tabs" id="tabs"></nav><div id="app"></div><footer>© 애니멀공화국 · 입양 전 상담은 입양 확정을 의미하지 않습니다.</footer></main><script>const questions=[
{id:1,q:'개인정보 및 마케팅 이용에 동의 하십니까?',type:'radio',opts:['동의 합니다.','동의하지 않습니다.'],note:'원본 문항을 유지했습니다. 실제 서비스에서는 개인정보 수집·이용 동의와 선택적 마케팅 동의를 분리해야 합니다.'},
{id:2,q:'이름',type:'text'},
{id:3,q:'생년월일',type:'date'},
{id:4,q:'연락처',type:'tel'},
{id:5,q:'반려동물을 선택하게 된 이유는 어떻게 되나요?',type:'textarea'},
{id:6,q:'현재 거주하고 있는 주거 환경은 어떻게 되나요?',type:'radio',opts:['투룸(투베이)','주택','아파트','기타'],other:true},
{id:7,q:'주거환경 계약은 어떤 형태 인가요?',type:'radio',opts:['자가','전세','월세','기타'],other:true},
{id:8,q:'전세 또는 월세 선택시 계약 조건에는 반려동물 가능이 허용 되어 있나요? (향후 확인 가능하여야 합니다.)',type:'radio',opts:['네','아니오'],when:a=>['전세','월세'].includes(a[7])},
{id:9,q:'현재 고정적인 수입이 발생하는 직업을 가지고 있나요?',type:'radio',opts:['네','아니요.']},
{id:10,q:'고양이와 가족이 된다면 매달 예상 지출 비용을 얼마로 예상하고 있나요?',type:'text'},
{id:11,q:'현재 가족 구성원은 어떻게 되나요?',type:'radio',opts:['1인 가구','신혼부부','2인 이상']},
{id:12,q:'신혼부부의 경우 자녀 계획이 있으신가요?',type:'radio',opts:['네','아니요.','지금은 아니지만 향후에 계획이 있습니다.','기타'],other:true,when:a=>a[11]==='신혼부부'},
{id:13,q:'2인 이상의 가구라면 가족 구성원을 기입해 주세요.',type:'textarea',when:a=>['신혼부부','2인 이상'].includes(a[11])},
{id:14,q:'2인 이상의 가구라면 가족 구성원 모두의 동의를 얻었나요?',type:'radio',opts:['네','아니오'],when:a=>['신혼부부','2인 이상'].includes(a[11])},
{id:15,q:'현재 함께하고 있는 반려동물이 있나요?',type:'radio',opts:['네','아니오']},
{id:16,q:'반려물이 있다면 종류와 몇 마리 인지 기입해 주세요.',type:'textarea',when:a=>a[15]==='네'},
{id:17,q:'가족 구성원 모두 알러지 검사를 하였나요? (알러지 검사를 추천 드립니다.)',type:'radio',opts:['네','아니오']},
{id:18,q:'준비사항 점검표',type:'checkbox',opts:['캣타워','화장실','사료','모래','빗','발톱깎이','스크레쳐','이동장','식기','장난감','목욕용품'],note:'현재 준비가 되어 있지 않아도 됩니다. 입양 전에 준비할 수 있도록 상담합니다.'},
{id:19,q:'혹시 상담을 원하는 고양이가 있으시다면 적어주세요.',type:'text',optional:true}
];


let cats=[],applications=[],admin=false,csrf='',tab='home',answers={},step=0,review=false,booking={date:'',time:'',note:''};
let adminApplicationFilter='new',adminApplicationPage=1;const ADMIN_PAGE_SIZE=10;
const app=document.getElementById('app'),tabs=document.getElementById('tabs');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',data){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:data===undefined?undefined:JSON.stringify(data),credentials:'same-origin'});let j=await r.json();if(!r.ok){if(r.status===401){admin=false;if(tab==='admin')renderAdmin()}throw new Error(j.error||'요청을 처리하지 못했습니다.')}return j}
async function refresh(){let d=await api('bootstrap');csrf=d.csrf;cats=d.cats;admin=d.admin}
function setTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){tabs.innerHTML=[['home','홈'],['cats','고양이 소개'],['survey','입양 설문'],['booking','상담 신청'],['admin','관리자']].map(([t,l])=>`<button class="${tab===t?'active':''}" data-tab="${t}">${l}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));({home:renderHome,cats:renderCats,survey:renderSurvey,booking:renderBooking,admin:renderAdmin})[tab]()}
function renderHome(){app.innerHTML=`<section class="card"><span class="pill">고양이와 가족이 되는 과정</span><h2>서두르지 않고, 충분히 알아가는 입양</h2><p>보호 중인 고양이를 알아보고, 사전 설문을 작성한 뒤 상담 일정을 신청해 주세요. 상담과 교육을 통해 함께 살아갈 준비를 확인합니다.</p><div class="row"><button id="goCats">고양이 둘러보기</button><button class="secondary" id="goSurvey">설문 작성하기</button></div></section><div class="grid"><div class="card"><h3>① 고양이 알아보기</h3><p>고양이별 입양 상태와 프로필을 확인합니다.</p></div><div class="card"><h3>② 사전 설문 작성</h3><p>기존 입양신청서 19문항을 작성합니다.</p></div><div class="card"><h3>③ 상담 일정 신청</h3><p>희망 일정을 남기고 관리자 확인을 기다립니다.</p></div></div>`;document.getElementById('goCats').onclick=()=>setTab('cats');document.getElementById('goSurvey').onclick=()=>setTab('survey')}
function renderCats(){app.innerHTML=`<h2>고양이 소개</h2><p>고양이별 입양 상태를 확인해 주세요.</p><div class="grid">${cats.map(c=>`<article class="card"><img class="catphoto" src="${c.photo||''}" alt="${esc(c.name)} 사진"><h3>${esc(c.name)}</h3><span class="pill">${esc(c.status)}</span><p>${esc(c.age)} · ${esc(c.sex||'정보 미등록')} · ${esc(c.neuter||'정보 미등록')}</p><p>${esc(c.personality)}</p><button data-cat="${esc(c.id)}" ${c.status!=='입양 가능'?'disabled':''}>이 고양이 상담하기</button></article>`).join('')}</div>`;app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{answers[19]=cats.find(c=>c.id===b.dataset.cat).name;step=0;review=false;setTab('survey')})}
function active(){return questions.filter(q=>!q.when||q.when(answers))}
function save(q){if(['text','tel','date','textarea'].includes(q.type))answers[q.id]=document.getElementById('answer').value.trim();if(q.other&&answers[q.id]==='기타')answers[q.id+'_other']=document.getElementById('othertext').value.trim()}
function renderSurvey(){if(review){app.innerHTML=`<section class="card"><h2>입양 사전 설문 · 답변 확인</h2><div class="summary">${active().map(q=>esc(q.id+'. '+q.q+'\n'+(Array.isArray(answers[q.id])?answers[q.id].join(', '):(answers[q.id]||'(미입력)'))+(answers[q.id]==='기타'?' '+(answers[q.id+'_other']||''):''))).join('\n\n')}</div><div class="row" style="margin-top:15px"><button class="secondary" id="edit">설문 수정</button><button id="nextBooking">상담 일정 선택</button></div></section>`;document.getElementById('edit').onclick=()=>{review=false;step=0;renderSurvey()};document.getElementById('nextBooking').onclick=()=>setTab('booking');return}
let qs=active();step=Math.min(step,qs.length-1);let q=qs[step],val=answers[q.id],control='';if(q.type==='radio'||q.type==='checkbox'){control=q.opts.map(o=>`<label class="choice"><input type="${q.type}" name="q${q.id}" value="${esc(o)}" ${q.type==='checkbox'?(Array.isArray(val)&&val.includes(o)?'checked':''):(val===o?'checked':'')}>${esc(o)}</label>`).join('');if(q.other)control+=`<div id="other" class="${val==='기타'?'':'hidden'}"><input id="othertext" type="text" placeholder="기타 내용을 입력해 주세요" value="${esc(answers[q.id+'_other']||'')}"></div>`}else if(q.type==='textarea')control=`<textarea id="answer" placeholder="자유롭게 작성해 주세요">${esc(val||'')}</textarea>`;else control=`<input id="answer" type="${q.type}" value="${esc(val||'')}" placeholder="입력해 주세요">`;
app.innerHTML=`<p class="muted">입양 사전 설문 · ${step+1}/${qs.length} · 원본 ${q.id}번</p><div class="progress"><div class="bar" style="width:${(step+1)/qs.length*100}%"></div></div><section class="card"><h3>${esc(q.id+'. '+q.q)} ${q.optional?'<small class="muted">(선택)</small>':''}</h3>${q.note?`<p class="muted">${esc(q.note)}</p>`:''}${control}<p id="error" class="error"></p></section><div class="row"><button class="secondary" id="back" ${step===0?'disabled':''}>이전</button><button id="next">${step===qs.length-1?'작성 내용 확인':'다음'}</button></div>`;
app.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(el=>el.onchange=()=>{if(q.type==='radio'){answers[q.id]=el.value;if(q.other)document.getElementById('other').classList.toggle('hidden',el.value!=='기타')}else answers[q.id]=[...app.querySelectorAll('input[type=checkbox]:checked')].map(e=>e.value)});
document.getElementById('back').onclick=()=>{save(q);step--;renderSurvey()};document.getElementById('next').onclick=()=>{save(q);if(!q.optional&&q.id!==18&&(!answers[q.id]||(Array.isArray(answers[q.id])&&!answers[q.id].length))){document.getElementById('error').textContent='답변을 입력하거나 선택해 주세요.';return}if(q.other&&answers[q.id]==='기타'&&!answers[q.id+'_other']){document.getElementById('error').textContent='기타 내용을 입력해 주세요.';return}if(step===active().length-1)review=true;else step++;renderSurvey()}}
async function renderBooking(){let today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());let min=today.toISOString().slice(0,10);app.innerHTML=`<section class="card"><h2>입양 상담 일정 신청</h2><p>상담은 60분 단위로 신청하며, 관리자 확인 후 확정됩니다.</p><div class="field"><label>상담 희망 날짜</label><input id="date" type="date" min="${min}" value="${esc(booking.date)}"></div><div class="field"><label>상담 희망 시간</label><select id="time"><option value="">날짜를 먼저 선택해 주세요</option></select><p class="muted" id="slotInfo">예약 가능 시간만 표시됩니다.</p></div><div class="field"><label>상담 전 전달사항 (선택)</label><textarea id="note">${esc(booking.note)}</textarea></div><p id="error" class="error"></p><button id="submit">상담 신청 접수</button></section>`;
const dateEl=document.getElementById('date'),timeEl=document.getElementById('time'),info=document.getElementById('slotInfo');
async function loadSlots(){let day=dateEl.value;timeEl.innerHTML='<option value="">시간을 선택해 주세요</option>';if(!day)return;info.textContent='예약 가능 시간 조회 중…';try{let d=await api('booking/availability?date='+encodeURIComponent(day));d.slots.forEach(t=>{let opt=document.createElement('option');opt.value=t;opt.textContent=t;timeEl.appendChild(opt)});if(d.slots.includes(booking.time))timeEl.value=booking.time;info.textContent=d.slots.length?'예약 가능한 시간만 표시됩니다.':'해당 날짜에 예약 가능한 시간이 없습니다.'}catch(e){info.textContent=e.message}}
dateEl.onchange=()=>{booking.date=dateEl.value;booking.time='';loadSlots()};if(dateEl.value)loadSlots();
document.getElementById('submit').onclick=async()=>{booking={date:dateEl.value,time:timeEl.value,note:document.getElementById('note').value};let err=document.getElementById('error');if(!booking.date||!booking.time){err.textContent='예약 가능한 날짜와 시간을 선택해 주세요.';return}if(!answers[2]||!answers[4]||!review){err.textContent='먼저 사전 설문을 끝까지 작성해 주세요.';return}let btn=document.getElementById('submit');btn.disabled=true;try{let d=await api('applications','POST',{...booking,answers});app.innerHTML=`<section class="card"><h2>상담 신청 접수 완료 ✓</h2><p>${esc(d.message)}</p><p>희망 일정: ${esc(booking.date+' '+booking.time)}</p><button id="goHome">홈으로</button></section>`;document.getElementById('goHome').onclick=()=>{answers={};review=false;step=0;setTab('home')}}catch(e){err.textContent=e.message;btn.disabled=false;await loadSlots()}}}
async function renderAdmin(){if(!admin){app.innerHTML=`<section class="card"><h2>관리자 전용 비밀번호</h2><p>공통 비밀번호를 입력하면 관리자 페이지에 접근할 수 있습니다. 비밀번호를 변경하면 모든 기기에 즉시 적용됩니다.</p><div class="field"><label>관리자 비밀번호</label><input type="password" id="adminPass" autocomplete="current-password"></div><p class="error" id="passError"></p><button id="unlock">관리자 페이지 들어가기</button></section>`;document.getElementById('unlock').onclick=async()=>{try{let d=await api('admin/unlock','POST',{password:document.getElementById('adminPass').value});csrf=d.csrf;admin=true;renderAdmin()}catch(e){document.getElementById('passError').textContent=e.message}};return}
let data;try{data=await api('admin/data')}catch(e){app.innerHTML=`<section class="card">${esc(e.message)}</section>`;return}applications=data.applications;
app.innerHTML=`<section class="card"><h2>관리자 대시보드</h2><div class="row"><button class="secondary" id="lock">관리자 잠그기</button><button class="secondary" id="changePass">공통 비밀번호 변경</button></div><p class="muted">서버에 저장된 고양이와 신청 목록입니다. 비밀번호 변경 시 다른 직원도 새 비밀번호를 사용해야 합니다.</p></section><section class="card" id="applicationsManager"><h3>상담 신청 목록 (${applications.length}) · 미확인 ${applications.filter(a=>!a.seen).length}건</h3><p class="muted">신규 신청을 먼저 확인하고, 필요한 신청만 골라 볼 수 있습니다. 한 페이지에 10건씩 표시합니다.</p><div class="row" id="applicationFilters" style="margin:12px 0"></div><div id="applicationList"></div><div id="detail"></div></section><section class="card" id="bookingManager"><h3>상담 일정 관리</h3><p class="muted">상담 가능 요일·시간 및 날짜별 차단을 설정합니다. 기존 예약은 자동 취소되지 않습니다.</p><div id="bookingManagerBody">불러오는 중…</div></section><section class="card"><h3>고양이 프로필 관리</h3><button id="newCat">+ 고양이 등록</button><div class="grid">${data.cats.map(c=>`<article class="miniCat"><img src="${c.photo||''}" alt="${esc(c.name)}"><div><b>${esc(c.name)}</b><p class="muted">${esc(c.age)} · ${esc(c.status)} · ${c.visible?'공개':'비공개'}</p><button class="secondary" data-edit="${esc(c.id)}">정보 수정</button> <button class="danger" data-delete="${esc(c.id)}">삭제</button></div></article>`).join('')}</div><div id="catEditor"></div></section>`;
renderApplicationList();
document.getElementById('lock').onclick=async()=>{let d=await api('admin/lock','POST',{});csrf=d.csrf;admin=false;setTab('home')};document.getElementById('changePass').onclick=()=>{let box=document.createElement('section');box.className='card';box.innerHTML=`<h3>공통 비밀번호 변경</h3><p>새 비밀번호는 12자 이상이어야 합니다. 변경 즉시 모든 직원의 기존 관리자 접근 권한이 만료됩니다.</p><div class="field"><label>현재 비밀번호</label><input id="oldPass" type="password"></div><div class="field"><label>새 비밀번호 (12자 이상)</label><input id="newPass" type="password"></div><div class="field"><label>새 비밀번호 확인</label><input id="newConfirm" type="password"></div><p id="changeError" class="error"></p><div class="row"><button id="savePass">변경 저장</button><button class="secondary" id="cancelPass">취소</button></div>`;app.prepend(box);document.getElementById('cancelPass').onclick=()=>box.remove();document.getElementById('savePass').onclick=async()=>{let old=document.getElementById('oldPass').value,now=document.getElementById('newPass').value;if(now!==document.getElementById('newConfirm').value){document.getElementById('changeError').textContent='새 비밀번호가 일치하지 않습니다.';return}try{let d=await api('admin/password','POST',{old,new:now});csrf=d.csrf;admin=false;alert(d.message);renderAdmin()}catch(e){document.getElementById('changeError').textContent=e.message}}};
// The application list is rendered separately so filtering does not reset other admin forms.
loadBookingManager();document.getElementById('newCat').onclick=()=>showCatEditor(null);app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showCatEditor(data.cats.find(c=>c.id===b.dataset.edit)));app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('정말 삭제하시겠습니까? 기록 보존을 위해 비공개 처리를 권장합니다.')){try{await api('admin/cats/'+encodeURIComponent(b.dataset.delete),'DELETE');await refresh();renderAdmin()}catch(e){alert(e.message)}}})}
function renderApplicationList(){
 const filters=document.getElementById('applicationFilters'),list=document.getElementById('applicationList'),detail=document.getElementById('detail');
 if(!filters||!list)return;
 const counts={new:applications.filter(a=>!a.seen).length,scheduled:applications.filter(a=>['승인 대기','승인 완료'].includes(a.status)).length,all:applications.length};
 const names={new:'신규',scheduled:'상담 예정',all:'전체'};
 filters.innerHTML=Object.keys(names).map(k=>`<button type="button" class="${adminApplicationFilter===k?'':'secondary'}" data-app-filter="${k}" aria-pressed="${adminApplicationFilter===k}">${names[k]} (${counts[k]})</button>`).join('');
 filters.querySelectorAll('[data-app-filter]').forEach(b=>b.onclick=()=>{adminApplicationFilter=b.dataset.appFilter;adminApplicationPage=1;detail.innerHTML='';renderApplicationList()});
 let rows=applications.filter(a=>adminApplicationFilter==='new'?!a.seen:adminApplicationFilter==='scheduled'?['승인 대기','승인 완료'].includes(a.status):true);
 // Backend already returns newest first. Keep unseen requests first in the All tab.
 if(adminApplicationFilter==='all')rows=[...rows.filter(a=>!a.seen),...rows.filter(a=>a.seen)];
 const pages=Math.max(1,Math.ceil(rows.length/ADMIN_PAGE_SIZE));adminApplicationPage=Math.min(Math.max(1,adminApplicationPage),pages);
 const offset=(adminApplicationPage-1)*ADMIN_PAGE_SIZE,visible=rows.slice(offset,offset+ADMIN_PAGE_SIZE);
 list.innerHTML=visible.length?`<div style="overflow:auto"><table><thead><tr><th>신청자</th><th>고양이</th><th>희망 일정</th><th>상태</th><th>관리</th></tr></thead><tbody>${visible.map(a=>`<tr><td>${a.seen?'':'🔔 '}${esc(a.name)}</td><td>${esc(a.cat)}</td><td>${esc(a.date+' '+a.time)}</td><td>${esc(a.status)}</td><td><select data-status="${esc(a.id)}" aria-label="${esc(a.name)} 상담 상태">${['승인 대기','승인 완료','상담 완료','취소'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select><button class="secondary" data-detail="${esc(a.id)}">설문 보기 / 확인</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">이 탭에 해당하는 상담 신청이 없습니다.</p>';
 list.innerHTML+=`<div class="row" style="justify-content:space-between;margin-top:14px"><span class="muted">총 ${rows.length}건 · ${adminApplicationPage}/${pages} 페이지</span><div class="row"><button type="button" class="secondary" id="appPrev" ${adminApplicationPage<=1?'disabled':''}>이전</button><button type="button" class="secondary" id="appNext" ${adminApplicationPage>=pages?'disabled':''}>다음</button></div></div>`;
 document.getElementById('appPrev').onclick=()=>{adminApplicationPage--;detail.innerHTML='';renderApplicationList()};
 document.getElementById('appNext').onclick=()=>{adminApplicationPage++;detail.innerHTML='';renderApplicationList()};
 list.querySelectorAll('[data-status]').forEach(el=>el.onchange=async()=>{const a=applications.find(x=>x.id===el.dataset.status);const old=a.status;try{await api('admin/applications/'+encodeURIComponent(a.id),'PATCH',{status:el.value});a.status=el.value;detail.innerHTML='';renderApplicationList()}catch(e){el.value=old;alert(e.message)}});
 list.querySelectorAll('[data-detail]').forEach(b=>b.onclick=async()=>{const a=applications.find(x=>x.id===b.dataset.detail);if(!a)return;
 detail.innerHTML=`<h3>${esc(a.name)} · 설문 답변</h3><div class="summary">${questions.filter(q=>!q.when||q.when(a.answers)).map(q=>esc(q.id+'. '+q.q+'\n'+(Array.isArray(a.answers[q.id])?a.answers[q.id].join(', '):a.answers[q.id]||'(미입력)'))).join('\n\n')}</div>`;
 try{await api('admin/applications/'+encodeURIComponent(a.id)+'/seen','POST',{});a.seen=true;renderApplicationList()}catch(e){alert('확인 상태를 저장하지 못했습니다: '+e.message)}
 });
}
async function loadBookingManager(){let el=document.getElementById('bookingManagerBody');if(!el)return;try{let d=await api('admin/booking');let r=d.rules;el.innerHTML=`<div class="field"><label>상담 가능 요일</label><div class="row">${['월','화','수','목','금','토','일'].map((x,i)=>`<label class="choice" style="padding:8px"><input type="checkbox" data-weekday="${i}" ${r.weekdays.includes(i)?'checked':''}>${x}</label>`).join('')}</div></div><div class="grid"><div class="field"><label>시작 시간</label><select id="ruleStart">${Array.from({length:13},(_,i)=>`${String(i+7).padStart(2,'0')}:00`).map(t=>`<option ${t===r.start_time?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>종료 시간</label><select id="ruleEnd">${Array.from({length:15},(_,i)=>`${String(i+9).padStart(2,'0')}:00`).map(t=>`<option ${t===r.end_time?'selected':''}>${t}</option>`).join('')}</select></div></div><p class="muted">예약은 60분 단위로 제공됩니다.</p><button id="saveRules">운영시간 저장</button><div class="editor"><h4>상담 불가 날짜 / 시간 추가</h4><div class="grid"><div class="field"><label>날짜</label><input id="blockDate" type="date"></div><div class="field"><label>차단 방식</label><select id="blockType"><option value="all">하루 전체</option><option value="part">일부 시간</option></select></div><div class="field" id="blockStartBox" style="display:none"><label>시작</label><input id="blockStart" type="time" step="1800" value="14:00"></div><div class="field" id="blockEndBox" style="display:none"><label>종료</label><input id="blockEnd" type="time" step="1800" value="16:00"></div></div><div class="field"><label>차단 사유</label><input id="blockReason" type="text" placeholder="휴무, 행사, 내부 일정"></div><button id="addBlock">차단 일정 추가</button><h4>등록된 차단 일정</h4>${d.blocks.length?d.blocks.map(b=>`<div class="row" style="margin:8px 0"><span>${esc(b.date)} · ${b.start_time?esc(b.start_time+'~'+b.end_time):'종일'} · ${esc(b.reason)}</span><button class="secondary" data-remove-block="${esc(b.id)}">삭제</button></div>`).join(''):'<p class="muted">등록된 차단 일정이 없습니다.</p>'}</div>`;
document.getElementById('blockType').onchange=e=>{let show=e.target.value==='part';document.getElementById('blockStartBox').style.display=show?'':'none';document.getElementById('blockEndBox').style.display=show?'':'none'};
document.getElementById('saveRules').onclick=async()=>{try{await api('admin/booking/rules','PUT',{weekdays:[...el.querySelectorAll('[data-weekday]:checked')].map(x=>Number(x.dataset.weekday)),start_time:document.getElementById('ruleStart').value,end_time:document.getElementById('ruleEnd').value});alert('상담 운영시간을 저장했습니다.')}catch(e){alert(e.message)}};
document.getElementById('addBlock').onclick=async()=>{let part=document.getElementById('blockType').value==='part';try{await api('admin/booking/blocks','POST',{date:document.getElementById('blockDate').value,start_time:part?document.getElementById('blockStart').value:null,end_time:part?document.getElementById('blockEnd').value:null,reason:document.getElementById('blockReason').value});await loadBookingManager()}catch(e){alert(e.message)}};
el.querySelectorAll('[data-remove-block]').forEach(b=>b.onclick=async()=>{if(!confirm('이 차단 일정을 삭제할까요?'))return;try{await api('admin/booking/blocks/'+encodeURIComponent(b.dataset.removeBlock),'DELETE');await loadBookingManager()}catch(e){alert(e.message)}})}catch(e){el.textContent=e.message}}
function showCatEditor(c){c=c||{name:'',age:'',sex:'정보 미등록',personality:'',neuter:'정보 미등록',status:'입양 가능',visible:1,photo:''};let el=document.getElementById('catEditor');el.innerHTML=`<div class="editor"><h3>${c.id?'고양이 정보 수정':'새 고양이 등록'}</h3><div class="field"><label>이름 *</label><input id="cName" value="${esc(c.name)}"></div><div class="field"><label>나이</label><input id="cAge" value="${esc(c.age)}"></div><div class="field"><label>성별</label><select id="cSex">${['정보 미등록','암컷','수컷'].map(x=>`<option ${c.sex===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>성격 및 특징</label><textarea id="cPersonality">${esc(c.personality)}</textarea></div><div class="field"><label>중성화 여부</label><select id="cNeuter">${['정보 미등록','중성화O','중성화X'].map(x=>`<option ${c.neuter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>입양 상태</label><select id="cStatus">${['입양 가능','상담 중','입양 완료'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>공개 여부</label><select id="cVisible"><option value="1" ${c.visible?'selected':''}>공개</option><option value="0" ${!c.visible?'selected':''}>비공개</option></select></div><div class="field"><label>사진 업로드 (JPG/PNG/WebP, 5MB 이하)</label><input type="file" id="cPhoto" accept="image/jpeg,image/png,image/webp"></div><p id="catError" class="error"></p><div class="row"><button id="saveCat">저장하기</button><button class="secondary" id="cancelCat">취소</button></div></div>`;el.scrollIntoView({behavior:'smooth'});document.getElementById('cancelCat').onclick=()=>el.innerHTML='';document.getElementById('saveCat').onclick=async()=>{let photo=c.photo||'',file=document.getElementById('cPhoto').files[0];if(file){if(file.size>5*1024*1024){document.getElementById('catError').textContent='사진은 5MB 이하로 선택해 주세요.';return}photo=await resizePhoto(file)}let item={id:c.id,name:document.getElementById('cName').value.trim(),age:document.getElementById('cAge').value.trim(),sex:document.getElementById('cSex').value,personality:document.getElementById('cPersonality').value.trim(),neuter:document.getElementById('cNeuter').value,status:document.getElementById('cStatus').value,visible:document.getElementById('cVisible').value==='1',photo};try{await api('admin/cats','POST',item);await refresh();renderAdmin()}catch(e){document.getElementById('catError').textContent=e.message}}}
function resizePhoto(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let im=new Image();im.onerror=reject;im.onload=()=>{let scale=Math.min(1,900/im.width,900/im.height),canvas=document.createElement('canvas');canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.73))};im.src=reader.result};reader.readAsDataURL(file)})}
refresh().then(render).catch(e=>app.textContent='서버에 연결하지 못했습니다: '+e.message);
</script></body></html>
